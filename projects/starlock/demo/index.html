    <section class="playground" aria-labelledby="demo-title">
      <div class="intro">
        <p class="eyebrow">STARLOCK PLAYGROUND</p>
        <h1 id="demo-title">亲手试试<br /><em>星锁。</em></h1>
        <p class="description">选一种方式，在弹窗里开始。</p>

          <button data-kind="digits" aria-pressed="false"><strong>数字验证</strong><span>读出图中的数字</span><i aria-hidden="true">↗</i></button>
          <button data-kind="text" aria-pressed="false"><strong>字符验证</strong><span>识别字母与数字</span><i aria-hidden="true">↗</i></button>
